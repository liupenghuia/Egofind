# EGoFind monorepo — NestJS + Taro mini-app + Vite admin-web
---
kit_version: 0.2.1
name: EGoFind
display_name: Yi Go Find
locales:
- zh
decision_owner: User
scopes:
  backend: true
  frontend: true
  mobile: false
  ios: false
  android: false
frontend_targets:
  # admin-web/ (Vite + React + Ant Design)
  web: true
  # mini-app/ (Taro 4 WeChat)
  miniprogram: true
# Kit stack ids (doctor validates these exist under kit stacks/).
# Actual source roots are backend/, admin-web/, mini-app/ — see package AGENTS.md.
stacks:
  backend: node-api
  web: static-admin-web
  miniprogram: wechat-miniprogram
truths:
  requirements: docs/requirements.md
  architecture: docs/architecture.md
  openapi: docs/openapi.yaml
  database: docs/database.md
  discovery: docs/product-discovery.md
  client_architecture: docs/client-architecture.md
  testing: docs/testing.md
  quality: docs/code-quality-prerequisites.md
  workflow: docs/delivery-workflow.md
  ui_design_system: docs/ui/design-system.md
  ui_design_role: docs/roles/ui-design.md
  delivery_pipeline: docs/delivery-pipeline.md
  orchestrator_role: docs/roles/orchestrator.md
quality:
  mode: code-first
  require_client_precheck: true
  commit_coauthor: true
delivery:
  max_rounds: 3
  evidence_root: "/tmp/agent-delivery/EGoFind"
  # nest build + vite build need headroom on cold CI
  command_timeout_sec: 300
  checks:
  - id: workflow
    cmd:
    - ruby
    - scripts/validate_workflow.rb

  # --- backend (@egofind/backend, NestJS + Prisma) ---
  - id: backend-test
    when: scopes.backend
    cwd: backend
    cmd:
    - pnpm
    - run
    - test:unit
  - id: backend-prisma
    when: scopes.backend
    cwd: backend
    cmd:
    - pnpm
    - exec
    - prisma
    - validate
  # HTTP process health. Uses EGOFIND_BOOT_WITHOUT_DB so Nest can listen
  # without MySQL; /health then reports db=down (still HTTP 200).
  # Full API smoke with real DB remains human_gate api-smoke-with-infra.
  # Build artifact: produced by backend-test (nest build → dist/main.js)
  - id: backend-health
    when: scopes.backend
    type: service_http
    cwd: backend
    start:
    - node
    - dist/main.js
    env:
      NODE_ENV: test
      PORT: "{{port}}"
      WECHAT_MOCK: "1"
      EGOFIND_BOOT_WITHOUT_DB: "1"
    health_url: http://127.0.0.1:{{port}}/health
    ready_timeout_sec: 30

  # --- admin-web (@egofind/admin-web, Vite + React) ---
  - id: admin-presence
    when: frontend_targets.web
    cmd:
    - ruby
    - scripts/check_admin_web.rb
    - admin-web
  - id: admin-build
    when: frontend_targets.web
    cwd: admin-web
    cmd:
    - pnpm
    - run
    - build
  - id: admin-health
    when: frontend_targets.web
    type: service_http
    cwd: admin-web
    start:
    - python3
    - "-m"
    - http.server
    - "{{port}}"
    - "--directory"
    - dist
    health_url: http://127.0.0.1:{{port}}/index.html
    ready_timeout_sec: 10

  # --- mini-app (@egofind/mini-app, Taro WeChat) ---
  # Structure + package shape. Full taro build / DevTools remain human gates
  # until the local Taro toolchain is green on this machine.
  - id: miniprogram-presence
    when: frontend_targets.miniprogram
    cmd:
    - ruby
    - scripts/check_mini_app.rb
    - mini-app

  human_gates:
  - id: production-deploy
    description: Production deploy requires explicit approval
  - id: wechat-devtools
    description: WeChat DevTools / real-device smoke for mini-app (Taro dist + AppID + privacy) remains manual
  - id: api-smoke-with-infra
    description: Full API smoke (pnpm smoke:api) requires MySQL+Redis via docker compose and a running API
kit:
  mode: link
  path: "/Users/Penguin/Documents/PPFiles_Learn/agent-delivery-kit"
owners:
  product: Product Agent
  architect: Architect Agent
  backend: Backend Agent
  frontend: Frontend Agent
  ui_design: UI Design Agent
  test: Test Agent
  orchestrator: Orchestrator Agent
# Optional command aliases (documentation for agents; not executed by runner)
commands:
  sequential:
  - 顺序完成
  - sequential
  - 交付
  ui_design:
  - UI设计
  - ui-design
  - 设计
